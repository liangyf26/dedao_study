obsidian:
  vault_path: "~/biji/openclaw-vault/5-收件箱(Inbox)"
  output_dir: "得到"
  year_subfolders: true
  filename_pattern: "{column}-{published_date}-{title}.md"

dedao:
  auth_state_path: "data/auth/dedao_state.json"
  browser_profile_dir: "data/browser_profile"
  headless: false
  request_interval_seconds: 2
  # Disabled by default because saved HTML can contain paid content.
  # Enable only when debugging extractor failures locally.
  save_failure_html: false
  failure_snapshot_dir: "data/page_failures"
  columns:
    - name: "快刀青衣·快刀广播站"
      url: "https://aiquan.dedao.cn/courseList?type=1"
      enabled: true
    - name: "尹烨·健康参考"
      url: "https://www.dedao.cn/course/detail?id=zp9lB3q0breKZq4sDWXYjyWxG64dg2"
      enabled: true
    - name: "马江博·政经参考"
      url: "https://www.dedao.cn/course/detail?id=ZWyMAOLnR4xJ1vqse8X65QaE8YG29k"
      enabled: true
    - name: "脱不花·长谈"
      url: "https://www.dedao.cn/course/detail?id=ElLD8OrepAxVvGMs4kJ2oybGdmBnvM"
      enabled: true
    - name: "得到头条"
      url: "https://www.dedao.cn/course/detail?id=nb9L2q1e3OxKBPNsdoJrgN8P0Rwo6B"
      enabled: true
    - name: "得到精选"
      url: "https://www.dedao.cn/course/detail?id=b0rNAzaYOj7VyPMs09K8P54m6wlk12"
      enabled: true
    - name: "得到直播"
      url: "https://www.dedao.cn/live/home"
      kind: "live"
      # Only backfill replays on or after this date; omit to sync all available replays.
      backfill_since: "2026-09-01"
      enabled: true

summary:
  enabled: true
  provider: "opencode_go"
  model: "deepseek-v4-pro"
  base_url_env: "OPENCODE_GO_BASE_URL"
  api_key_env: "OPENCODE_GO_API_KEY"

transcription:
  # Disabled by default. Enable only after confirming ASR cost/entitlement.
  enabled: false
  provider: "s3ai"
  free_tier_confirmed: false
  api_key_env: "S3AI_API_KEY"
  endpoint_env: "S3AI_BASE_URL"
  models:
    - "whisper-large-v3-turbo"
    - "FunAudioLLM/SenseVoiceSmall"
    - "TeleAI/TeleSpeechASR"
  model_retries: 1
  asr_concurrency: 2
  checkpoint_enabled: true
  model_circuit_breaker_threshold: 2
  delete_media_after_transcription: true
  temp_dir: "data/media_cache"
  max_duration_seconds: 14400
  max_audio_bytes: 100000000
  request_timeout_seconds: 120
  max_segments: 24
  min_free_disk_bytes: 1000000000

feishu:
  enabled: true
  webhook_url_env: "FEISHU_WEBHOOK_URL"
  secret_env: "FEISHU_WEBHOOK_SECRET"
  include_titles: true
